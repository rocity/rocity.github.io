<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body id="top" class="{% if page.theme == 'dark' %}theme-dark{% endif %}">
    <a class="skip link" href="#main">Skip to content</a>
    <div class="grain" aria-hidden="true"></div>
    <div class="wipe" aria-hidden="true"></div>

    {% include nav.html %}

    <main id="main">
      {{ content }}
    </main>

    {% unless page.contact == false %}
      {% include contact.html %}
    {% endunless %}

    {% include footer.html %}

    {% include footer-scripts.html %}
  </body>
</html>
