---
layout: base
---

{% assign tagged = site.posts | where_exp: "post", "post.tags contains page.tag" %}

<header class="page-head wrap grid">
  <div class="rail">{% include label.html text="Tag" %}</div>
  <div class="field">
    <h1 class="f-title" data-split>{{ page.tag }}</h1>
    <p class="post-head__sub f-aside">({{ tagged.size }} {% if tagged.size == 1 %}post{% else %}posts{% endif %})</p>
  </div>
</header>

<section class="section wrap grid">
  <div class="field">
    {% include post-table.html posts=tagged id="tagged" %}
  </div>
</section>
