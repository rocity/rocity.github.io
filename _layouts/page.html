---
layout: base
---

<header class="page-head wrap grid">
  {% assign label = page.label | default: "Page" %}
  <div class="rail">{% include label.html text=label %}</div>
  <div class="field">
    <h1 class="f-title" data-split>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-head__sub f-aside">({{ page.subtitle }})</p>{% endif %}
  </div>
</header>

<div class="post-body wrap grid">
  <div class="prose">
    {{ content }}
  </div>
</div>

{% if page.comments %}
<div class="wrap grid">
  <div class="prose">{% include disqus.html %}</div>
</div>
{% endif %}
