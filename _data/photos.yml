# Photos, served from /img/photos/<id>-1000.jpg and <id>-1600.jpg.
# width/height are the 1600px version's, so the browser can reserve space.
#
# Originals live outside the repo. To add one:
#   sips -Z 1000 -s format jpeg -s formatOptions 76 IN.jpg --out img/photos/<id>-1000.jpg
#   sips -Z 1600 -s format jpeg -s formatOptions 70 IN.jpg --out img/photos/<id>-1600.jpg

